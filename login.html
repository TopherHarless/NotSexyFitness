<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Not Sexy Fitness</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a3a6b 0%, #2a5298 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 48px 40px;
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    .logo {
      font-size: 13px;
      font-weight: 800;
      color: #1a3a6b;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .logo span { color: #e8861a; }
    h1 { font-size: 26px; font-weight: 700; color: #1a202c; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #718096; margin-bottom: 36px; line-height: 1.5; }
    #google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #1a202c;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    #google-btn:hover:not(:disabled) {
      border-color: #1a3a6b;
      background: #f7f8fc;
      box-shadow: 0 2px 8px rgba(26, 58, 107, 0.12);
    }
    #google-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .google-icon { width: 20px; height: 20px; flex-shrink: 0; }
    #status {
      margin-top: 20px;
      font-size: 13px;
      min-height: 20px;
      color: #e53e3e;
      line-height: 1.5;
    }
    #status.info { color: #718096; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Not <span>Sexy</span> Fitness</div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in with your Google account to access your fitness resources.</p>

    <button id="google-btn" onclick="signIn()">
      <svg class="google-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Sign in with Google
    </button>

    <div id="status"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script>
    const WHITELIST = ['kharless@gmail.com'];

    const FIREBASE_CONFIG = {
      apiKey: 'AIzaSyCZ49TDQjIgHoOfna8yHg01W-Tc5D5Eidk',
      authDomain: 'notsexyfitness-72d40.firebaseapp.com',
      projectId: 'notsexyfitness-72d40',
      storageBucket: 'notsexyfitness-72d40.firebasestorage.app',
      messagingSenderId: '1057577322874',
      appId: '1:1057577322874:web:57f0eb89fda9acacf8aec3',
    };

    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();

    function getNextUrl() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next');
      if (next) {
        try {
          const u = new URL(next);
          if (u.origin === window.location.origin) return next;
        } catch (e) {}
      }
      return window.location.origin + '/index.html';
    }

    function setStatus(msg, isInfo) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = isInfo ? 'info' : '';
    }

    function signIn() {
      const btn = document.getElementById('google-btn');
      btn.disabled = true;
      setStatus('Signing in…', true);
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(err => {
        btn.disabled = false;
        setStatus('Sign-in failed: ' + err.message);
      });
    }

    auth.onAuthStateChanged(user => {
      if (!user) return;
      if (!WHITELIST.includes(user.email)) {
        auth.signOut();
        setStatus(user.email + ' is not authorized to access this site.');
        document.getElementById('google-btn').disabled = false;
        return;
      }
      setStatus('Signed in! Redirecting…', true);
      window.location.replace(getNextUrl());
    });
  </script>
</body>
</html>
