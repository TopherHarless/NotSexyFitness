.item-stats{display:flex;gap:10px;flex-wrap:wrap}

(function(){

// ===== ACTIVATE RESTAURANT =====
function activateRestaurant(r, silent) {
  const switching = activeR && activeR !== r;
  activeR = r;

  // Highlight active in sidebar and pills
  qsa('.r-btn').forEach(b => b.classList.toggle('active', b.dataset.id === r.id));
  qsa('.mpill').forEach(b => b.classList.toggle('active', b.dataset.id === r.id));
  setText('active-r-name', r.name);

  // Clear builder
  builder = [];
  updateBuilderUI();

  // Render tabs and show All tab first
  const cats = getRestaurantCats(r);

function getRestaurantCats(r) {
  const present = new Set(r.items.map(i => i.category));
  return CAT_ORDER.filter(c => present.has(c));
}

// ===== TABS =====
function renderTabs(cats) {
  const tabs = qs('#tabs');
  tabs.innerHTML = '';
  const allBtn = el('button', { className: 'tab-btn', 'data-cat': '__all__' }, 'All');
  allBtn.addEventListener('click', () => showCategory('__all__'));

}

function showCategory(cat) {
  activeCat = cat;
  qsa('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  currentItems = cat === '__all__' ? activeR.items.slice() : activeR.items.filter(i => i.category === cat);
  const hpBadges = highProteinBadges(currentItems);
  const hfBadges = highFiberBadges(currentItems);
  renderItems(applySort(currentItems, currentSort), hpBadges, hfBadges, cat === '__all__');
}

// ===== SORT =====
function applySort(items, sort) {
  const copy = items.slice();
  const ratio = (n, cal) => cal > 0 ? n / cal : -1;
  if (sort === 'value')    return copy.sort((a, b) => ratio(a.protein_g + a.fiber_g, a.calories) - ratio(b.protein_g + b.fiber_g, b.calories)).reverse();
  if (sort === 'protein')  return copy.sort((a, b) => ratio(a.protein_g, a.calories) - ratio(b.protein_g, b.calories)).reverse();
  if (sort === 'fiber')    return copy.sort((a, b) => ratio(a.fiber_g, a.calories) - ratio(b.fiber_g, b.calories)).reverse();
  if (sort === 'cal-asc')  return copy.sort((a, b) => a.calories - b.calories);
  if (sort === 'cal-desc') return copy.sort((a, b) => b.calories - a.calories);
  return copy;
}

function renderSortBar() {
  const bar = qs('#sort-bar');
  bar.innerHTML = '';
  const sorts = [
    { key: 'default',  label: 'Default' },
    { key: 'value',    label: 'Best Value' },
    { key: 'protein',  label: 'Best Protein/Cal' },
    { key: 'fiber',    label: 'Best Fiber/Cal' },
    { key: 'cal-asc',  label: 'Lowest Cal' },
    { key: 'cal-desc', label: 'Highest Cal' },
  ];
  sorts.forEach(s => {
    const btn = el('button', { className: 'sort-pill' + (currentSort === s.key ? ' active' : ''), 'data-sort': s.key }, s.label);
    btn.addEventListener('click', () => {
      currentSort = s.key;
      qsa('.sort-pill').forEach(p => p.classList.toggle('active', p.dataset.sort === s.key));
      const items = activeCat === '__all__' ? activeR.items.slice() : activeR.items.filter(i => i.category === activeCat);
      const hpBadges = highProteinBadges(items);
      const hfBadges = highFiberBadges(items);
      renderItems(applySort(items, currentSort), hpBadges, hfBadges, activeCat === '__all__');
    });
    bar.appendChild(btn);
  });
}

// ===== HIGH PROTEIN BADGES =====
function highProteinBadges(items) {
  const scored = items
    .filter(i => i.calories > 0 && i.protein_g > 0)
    .map(i => ({ name: i.name, ratio: i.protein_g / i.calories }))
    .sort((a, b) => b.ratio - a.ratio);
  return new Set(scored.slice(0, 3).map(x => x.name));
}

// ===== HIGH FIBER BADGES =====
function highFiberBadges(items) {
  const scored = items
    .filter(i => i.calories > 0 && i.fiber_g > 0)
    .map(i => ({ name: i.name, ratio: i.fiber_g / i.calories }))
    .sort((a, b) => b.ratio - a.ratio);
  return new Set(scored.slice(0, 3).map(x => x.name));
}

function renderItems(items, hpBadges, hfBadges, showCat) {

    if (hpBadges.has(item.name)) {

// ===== BUILDER =====
function addToBuilder(item) {
  builder.push({ ...item, _uid: Date.now() + Math.random() });
  updateBuilderUI();
}

function removeFromBuilder(uid) {
  builder = builder.filter(i => i._uid !== uid);
  updateBuilderUI();
}

function clearBuilder() {
  builder = [];
  updateBuilderUI();
}

function updateBuilderUI() {
  const totalCal = builder.reduce((s, i) => s + (i.calories || 0), 0);
  const totalPro = builder.reduce((s, i) => s + (i.protein_g || 0), 0);
  const totalFib = builder.reduce((s, i) => s + (i.fiber_g || 0), 0);

  setText('t-cal', totalCal);
  setText('t-pro', round1(totalPro) + 'g');
  setText('t-fib', round1(totalFib) + 'g');

  const bldItems = qs('#bld-items');
  bldItems.innerHTML = '';

  if (!builder.length) {
    bldItems.appendChild(el('p', { className: 'bld-empty' }, 'Add items from the menu'));
    return;
  }

  builder.forEach(item => {
    const bi = document.createElement('div');
    bi.className = 'bi';

    const info = document.createElement('div');
    info.className = 'bi-info';
    info.appendChild(el('span', { className: 'bi-name' }, item.name));

    const chips = document.createElement('div');
    chips.className = 'bi-chips';
    chips.appendChild(el('span', { className: 'bi-chip-cal' }, item.calories + ' cal'));
    chips.appendChild(el('span', { className: 'bi-chip-pro' }, item.protein_g + 'g pro'));
    chips.appendChild(el('span', { className: 'bi-chip' }, item.fiber_g + 'g fib'));
    info.appendChild(chips);

    bi.appendChild(info);

  }

// ===== REFRESH =====
function bindRefresh() {
  qs('#refresh-btn').addEventListener('click', doRefresh);
}

async function doRefresh() {
  const btn = qs('#refresh-btn');
  const status = qs('#refresh-status');
  btn.disabled = true;
  btn.textContent = 'Refreshing…';
  status.textContent = 'Fetching…';

  try {
    // Try direct fetch first — will likely hit CORS and fall through
    let items = null;
    try {
      const resp = await Promise.race([
        fetch('https://www.chick-fil-a.com/nutrition-allergens'),
        new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 6000))
      ]);
      const html = await resp.text();
      if (html.includes('data-wp-each-child')) {
        // Data is present in raw HTML — parse it
        items = parseNutritionHtml(html);
      }
    } catch (e) {
      // CORS or timeout — fall through to serverless
    }

    if (!items || items.length < 10) {
      // Serverless fallback
      const resp = await fetch('/api/refresh-menu');
      if (!resp.ok) throw new Error('API error ' + resp.status);
      const data = await resp.json();
      items = data.items;
    }

    if (!items || items.length < 10) throw new Error('No usable data returned');

    const payload = { items, refreshed: new Date().toISOString() };
    localStorage.setItem('nsf_menu_cfa', JSON.stringify(payload));
    RESTAURANTS[0].items = items;

    const d = new Date(payload.refreshed);
    status.textContent = 'Refreshed ' + d.toLocaleDateString();
    activateRestaurant(activeR, true);
    showMsg('Menu data refreshed');
  } catch (e) {
    status.textContent = 'Refresh failed';
    console.error('Refresh error:', e);
    alert('Refresh failed. Using stored data. Check the console for details.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Refresh';
  }
}

// Parse pre-rendered HTML from CFA nutrition page
function parseNutritionHtml(html) {
  const VALID = new Set(['Breakfast','Entrées','Salads','Sides','Treats','Drinks','Coffee','Dipping Sauces','Dressings']);
  const CAT_RX = [
    ['Breakfast', 'Breakfast'], ['Entrées', 'Entr'], ['Salads', 'Salads'],
    ['Sides', 'Sides'], ['Treats', 'Treats'], ['Drinks', 'Drinks'],
    ['Coffee', 'Coffee'], ['Dipping Sauces', 'Dipping Sauces'], ['Dressings', 'Dressings']
  ];

  // Build category positions (search after nav area ~pos 8000)
  const catPos = [];
  for (const [cat, search] of CAT_RX) {
    const needle = 'id="' + search + '"';
    let idx = html.indexOf(needle, 8000);
    if (idx >= 0) catPos.push({ cat, pos: idx });
  }
  catPos.sort((a, b) => a.pos - b.pos);

  function getCategory(pos) {
    let cat = null;
    for (const cp of catPos) {
      if (pos >= cp.pos) cat = cp.cat;
      else break;
    }
    return cat && VALID.has(cat) ? cat : null;
  }

  function toNum(v) {
    return parseFloat((v || '').replace(/[^\d.]/g, '')) || 0;
  }

  const items = [];
  // Match each-child td blocks with nutrition values
  const tdRx = /data-wp-each-child="[^"]*::context\.(menu_item|sub_item)\.fields"[\s\S]*?class="sr-only"[^>]*>([^<]+)<\/span>[\s\S]*?inert[^>]*>\s*([^<]*)\s*<\/span>/g;

  // Group consecutive matches into sets of 11
  const allMatches = [];
  let m;
  while ((m = tdRx.exec(html)) !== null) {
    allMatches.push({ type: m[1], label: m[2], value: m[3].trim(), pos: m.index });
  }

  for (let i = 0; i < allMatches.length - 10; i++) {
    // Check if next 11 are consecutive (same item)
    const group = allMatches.slice(i, i + 11);
    if (group[0].type !== group[10].type) continue;
    if (!group[1].label.includes('Calorie')) continue;

    const pos = group[0].pos;
    const cat = getCategory(pos);
    if (!cat) { i += 10; continue; }

    // Find item name
    let name = null;
    const lookback = html.slice(Math.max(0, pos - 2000), pos);
    if (group[0].type === 'menu_item') {
      const am = [...lookback.matchAll(/<a\s+href="https:\/\/www\.chick-fil-a\.com\/[^"]*"[^>]*>([^<]+)<\/a>/g)];
      if (am.length) name = am[am.length - 1][1].trim();
    } else {
      const tm = [...lookback.matchAll(/<td\s+data-wp-text="context\.sub_item\.title"\s+tabindex="0">\s*([^<]+)\s*<\/td>/g)];
      if (tm.length) name = tm[tm.length - 1][1].trim();
    }

    if (!name) { i += 10; continue; }

    items.push({
      name: name.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&#8211;/g, '–').replace(/®/g, '®'),
      category: cat,
      calories: toNum(group[1].value),
      fat_g: toNum(group[2].value),
      sat_fat_g: toNum(group[3].value),
      carbs_g: toNum(group[7].value),
      fiber_g: toNum(group[8].value),
      sugar_g: toNum(group[9].value),
      protein_g: toNum(group[10].value),
    });
    i += 10; // skip to next group
  }

  // Deduplicate
  const seen = new Set();
  return items.filter(item => {
    const key = item.name + '|' + item.category + '|' + item.calories;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

// ===== HELPERS =====
function qs(sel) { return document.querySelector(sel); }
function qsa(sel) { return document.querySelectorAll(sel); }
function setText(id, txt) { const e = document.getElementById(id); if (e) e.textContent = txt; }
function round1(v) { return Math.round(v * 10) / 10; }

function el(tag, attrs, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'className') e.className = v;
    else if (k === 'style') e.setAttribute('style', v);
    else if (k.startsWith('data-')) e.setAttribute(k, v);
    else e[k] = v;
  }
  if (text !== undefined) e.textContent = text;
  return e;
}

function showMsg(msg) {
  const el = qs('#switch-msg');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ===== AI SUGGEST FEATURE =====
const SLOT_CATS = {
  entree: ['Entrées', 'Salads'],
  side:   ['Sides'],
  drink:  ['Drinks', 'Coffee'],
};

let suggestions = [];

function initSuggest() {
  qs('#suggest-btn').addEventListener('click', () => {
    openSuggestPanel();
    runSuggest();
  });
  qs('#suggest-close').addEventListener('click', closeSuggestPanel);
}

function openSuggestPanel() {
  qs('#suggest-panel').classList.add('open');
}

function closeSuggestPanel() {
  qs('#suggest-panel').classList.remove('open');
}

async function runSuggest() {
  showSuggestSpinner();
  const filtered = filterMenuForAI();

  try {
    const resp = await fetch('/api/suggest-meal', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ menuItems: filtered }),
    });
    if (!resp.ok) throw new Error('API ' + resp.status);
    const data = await resp.json();
    if (!Array.isArray(data.combos) || !data.combos.length) throw new Error('Empty combos');
    suggestions = data.combos;
    renderComboCards();
  } catch (e) {
    console.error('suggest-meal error:', e);
    showSuggestError();
  }
}

function filterMenuForAI() {
  const now = new Date();
  const hrs = now.getHours() + now.getMinutes() / 60;
  const INCLUDE = new Set(['Entrées', 'Salads', 'Sides', 'Drinks', 'Coffee']);
  if (hrs < 10.5) INCLUDE.add('Breakfast');

  const items = activeR ? activeR.items : BUILT_IN_CFA;
  return items
    .filter(i => INCLUDE.has(i.category))
    .map(i => ({ name: i.name, calories: i.calories, protein_g: i.protein_g, fiber_g: i.fiber_g }));
}

function showSuggestSpinner() {
  const body = qs('#suggest-body');
  body.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'suggest-spinner';
  const ring = document.createElement('div');
  ring.className = 'spinner-ring';
  wrap.appendChild(ring);
  wrap.appendChild(el('span', {}, 'Finding your best options…'));
  body.appendChild(wrap);
}

function showSuggestError() {
  const body = qs('#suggest-body');
  body.innerHTML = '';
  body.appendChild(el('p', { className: 'suggest-error' }, "Couldn’t generate suggestions, try again"));
}

function renderComboCards() {
  const body = qs('#suggest-body');
  body.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'suggest-cards';
  suggestions.forEach((combo, idx) => row.appendChild(buildComboCard(combo, idx)));
  body.appendChild(row);
}

function buildComboCard(combo, idx) {
  const card = document.createElement('div');
  card.className = 'combo-card';
  card.dataset.idx = idx;

  card.appendChild(el('div', { className: 'combo-title' }, combo.title));
  card.appendChild(el('div', { className: 'combo-reason' }, combo.reason));

  const slots = document.createElement('div');
  slots.className = 'combo-slots';
  ['entree', 'side', 'drink'].forEach(slot => {
    if (combo[slot]) slots.appendChild(buildSlotBlock(combo, idx, slot));
  });
  card.appendChild(slots);

  card.appendChild(buildComboTotals(combo));

  const addBtn = el('button', { className: 'combo-add-btn' }, 'Add all to builder');
  addBtn.addEventListener('click', () => {
    ['entree', 'side', 'drink'].forEach(slot => {
      if (combo[slot]) addToBuilder(combo[slot]);
    });
  });
  card.appendChild(addBtn);

  return card;
}

function buildSlotBlock(combo, idx, slot) {
  const block = document.createElement('div');
  block.dataset.slot = slot;

  const labelMap = { entree: 'Entree', side: 'Side', drink: 'Drink' };
  block.appendChild(el('div', { className: 'slot-label' }, labelMap[slot]));

  const row = document.createElement('div');
  row.className = 'slot-row';

  const item = combo[slot];
  const info = document.createElement('div');
  info.className = 'slot-info';
  info.appendChild(el('span', { className: 'slot-name' }, item.name));

  const chips = document.createElement('div');
  chips.className = 'slot-chips';
  chips.appendChild(el('span', { className: 'bi-chip-cal' }, item.calories + ' cal'));
  chips.appendChild(el('span', { className: 'bi-chip-pro' }, item.protein_g + 'g pro'));
  chips.appendChild(el('span', { className: 'bi-chip' }, item.fiber_g + 'g fib'));
  info.appendChild(chips);

  const swapBtn = el('button', { className: 'swap-btn' }, 'Swap');
  swapBtn.addEventListener('click', () => {
    const existing = block.querySelector('.swap-list');
    if (existing) {
      existing.remove();
      swapBtn.classList.remove('active');
      return;
    }
    const alts = getSwapAlts(slot, item.name);
    if (!alts.length) return;
    swapBtn.classList.add('active');
    block.appendChild(buildSwapList(alts, idx, slot));
  });

  row.appendChild(info);
  row.appendChild(swapBtn);
  block.appendChild(row);
  return block;
}

function buildSwapList(alts, idx, slot) {
  const list = document.createElement('div');
  list.className = 'swap-list';

  alts.forEach(alt => {
    const opt = document.createElement('div');
    opt.className = 'swap-option';

    const nameEl = el('span', { className: 'swap-opt-name' }, alt.name);
    const chips = document.createElement('div');
    chips.className = 'swap-opt-chips';
    chips.appendChild(el('span', { className: 'bi-chip-cal' }, alt.calories + ' cal'));
    chips.appendChild(el('span', { className: 'bi-chip-pro' }, alt.protein_g + 'g pro'));
    chips.appendChild(el('span', { className: 'bi-chip' }, alt.fiber_g + 'g fib'));

    opt.appendChild(nameEl);
    opt.appendChild(chips);

    opt.addEventListener('click', () => {
      suggestions[idx][slot] = { name: alt.name, calories: alt.calories, protein_g: alt.protein_g, fiber_g: alt.fiber_g };
      const oldCard = qs('.combo-card[data-idx="' + idx + '"]');
      const newCard = buildComboCard(suggestions[idx], idx);
      oldCard.parentNode.replaceChild(newCard, oldCard);
    });

    list.appendChild(opt);
  });

  return list;
}

function buildComboTotals(combo) {
  const wrap = document.createElement('div');
  wrap.className = 'combo-totals';

  const activeSlots = ['entree', 'side', 'drink'].filter(s => combo[s]);
  const totalCal = activeSlots.reduce((s, k) => s + (combo[k].calories || 0), 0);
  const totalPro = activeSlots.reduce((s, k) => s + (combo[k].protein_g || 0), 0);
  const totalFib = activeSlots.reduce((s, k) => s + (combo[k].fiber_g || 0), 0);

  [
    { val: totalCal + ' cal', label: 'Calories' },
    { val: round1(totalPro) + 'g',  label: 'Protein'  },
    { val: round1(totalFib) + 'g',  label: 'Fiber'    },
  ].forEach(({ val, label }) => {
    const item = document.createElement('div');
    item.className = 'combo-total-item';
    item.appendChild(el('span', { className: 'combo-total-val' }, val));
    item.appendChild(el('span', { className: 'combo-total-label' }, label));
    wrap.appendChild(item);
  });

  return wrap;
}

function getSwapAlts(slot, currentName) {
  const now = new Date();
  const hrs = now.getHours() + now.getMinutes() / 60;
  const INCLUDE = new Set(['Entrées', 'Salads', 'Sides', 'Drinks', 'Coffee']);
  if (hrs < 10.5) INCLUDE.add('Breakfast');

  const items = activeR ? activeR.items : BUILT_IN_CFA;

  // Prefer the item's actual category; fall back to slot mapping
  const found = items.find(i => i.name === currentName);
  const cats = found ? [found.category] : SLOT_CATS[slot];

  return items
    .filter(i => cats.includes(i.category) && INCLUDE.has(i.category) && i.name !== currentName && i.calories > 0)
    .sort((a, b) => ((b.protein_g + b.fiber_g) / b.calories) - ((a.protein_g + a.fiber_g) / a.calories))
    .slice(0, 8);
}

init();
})();

// ===== SHARED NAV =====
(function() {
  var auth = firebase.auth();
  var currentUser = null;

  window.toggleAuth = function() {
    if (currentUser) {
      auth.signOut();
    } else {
      var provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(function(e) { console.error(e); });
    }
  };

  window.setCueMode = function(mode) {
    localStorage.setItem('nasm_cue_mode', mode);
    var t = document.getElementById('cue-trainer-btn');
    var c = document.getElementById('cue-client-btn');
    if (t) t.classList.toggle('active', mode === 'trainer');
    if (c) c.classList.toggle('active', mode === 'client');
  };

  auth.onAuthStateChanged(function(user) {
    currentUser = user;
    var btn = document.getElementById('auth-btn');
    var userEl = document.getElementById('auth-user');
    if (!btn) return;
    if (user) {
      btn.textContent = 'Sign Out';
      if (userEl) userEl.textContent = user.displayName || user.email;
    } else {
      btn.textContent = 'Sign In with Google';
      if (userEl) userEl.textContent = '';
    }
  });

  // Restore cue mode preference
  setCueMode(localStorage.getItem('nasm_cue_mode') || 'trainer');
})();
</script>
